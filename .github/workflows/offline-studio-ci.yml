name: TrendyJoes Offline Studio CI
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python 3.12 for STL regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STL geometry orientation repair and exports
        run: |
          python -m pip install 'trimesh==4.11.1' 'networkx==3.4.2'
          python -m unittest discover -s tests -p 'test_stl_orientation.py' -v
      - name: Check offline preview asset integrity
        run: npm run preview:assets:check
      - name: Check protected static preview asset integrity
        run: npm run preview:static:assets:check
      - name: Execute bounded Studio security and manufacturing regressions
        run: node --test --test-concurrency=4 tests/objective35b*.test.mjs tests/objective35c*.test.mjs
